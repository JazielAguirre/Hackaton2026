<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Control de calidad de fruta por lote." />
    <title>FruitScan</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro/oscuro (ver src/hooks/useTheme.ts)
      try {
        var tema = localStorage.getItem('fruitscan-tema')
      } catch (e) {}
      if (tema !== 'light' && tema !== 'dark') {
        tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = tema
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
